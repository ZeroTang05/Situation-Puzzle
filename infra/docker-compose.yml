# 生产部署编排：Caddy（HTTPS 入口）+ API + Jobs + PostgreSQL（docs/rebuild/03-SPEC.md §8）
# 数据库与任务端口仅内网可达；公网只暴露 80/443。
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - web-dist:/srv/web:ro
      - admin-dist:/srv/admin:ro
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:-localhost}

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - '8080'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  jobs:
    build:
      context: ..
      dockerfile: infra/jobs.Dockerfile
    restart: unless-stopped
    env_file: ../.env.production
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 必填}
      POSTGRES_DB: ${POSTGRES_DB:-jev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 备份目标须离机存放；容器卷只做第一层兜底（docs/rebuild/02-MVP.md §4）
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-jev}']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  web-dist:
  admin-dist:
