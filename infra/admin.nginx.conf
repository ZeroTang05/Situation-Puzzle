# apps/admin 管理端：暴露在宿主域名的 /admin/* 下，容器内部按根路径解析静态文件。
# 流程：浏览器 https://host/admin/* → 宿主 Nginx → 容器 :80/* → nginx 用 rewrite 剥前缀
# 解析到 /usr/share/nginx/html/*，与 vite 产物的 base: '/admin/' 对齐。
server {
    listen 80;
    server_name _;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 256;

    # API 反代（不剥前缀，因为前端用 fetch('/api/v1/...')）
    location /api/v1/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 20m;
        proxy_connect_timeout 15s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # 静态与 SPA：把 /admin/(.*) 改写为 /，再交给 try_files 找文件 /
    # 回退到 /index.html。rewrite ^/admin/?(.*)$ /$1 break;
    location / {
        root /usr/share/nginx/html;
        # 先按剥前缀后的路径找文件；找不到走 SPA index.html
        # 注意：rewrite 在 root 之外做，因为 nginx 的 try_files 之前会先把 url 写入
        # $uri/$request_uri；用 break 停止后续 rewrite 匹配。
        rewrite ^/admin/?(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # 内容散列资源长期缓存
    location /assets/ {
        root /usr/share/nginx/html;
        rewrite ^/admin/?(.*)$ /$1 break;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
