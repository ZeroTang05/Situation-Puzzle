# 一行命令部署：docker compose up -d --build
# 前置：cp .env.example .env 并填写 POSTGRES_PASSWORD 与各项密钥（.env 同时用于
#       compose 变量插值与容器环境注入）；DATABASE_URL 自动拼装，无需手填。
#
# 拓扑：宿主 Nginx 反代 → web:80 / admin:80（前端静态 + 容器内已反代 API/WS）
#       api / jobs / postgres 不直接对外，仅 web & admin 容器内部与服务名互通。
services:
  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    # 高位端口外暴：宿主 Nginx 用 127.0.0.1:18081 反代 / (玩家端)
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-18081}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  admin:
    build:
      context: .
      dockerfile: infra/admin.Dockerfile
    restart: unless-stopped
    # 高位端口外暴：宿主 Nginx 用 127.0.0.1:18082 反代 /admin (管理端)
    ports:
      - '127.0.0.1:${ADMIN_HOST_PORT:-18082}:80'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1/']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 数据库连接指向 compose 内的 postgres 服务；覆盖 .env 里的同名字段
      DATABASE_URL: postgresql://${POSTGRES_USER:-jev}:${POSTGRES_PASSWORD:?请在 .env 填写 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jev}
      # 对外完整地址（即 better-auth 校验 Origin 用的那个；接 Nginx 后改 https://<域名>）
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:${WEB_HOST_PORT:-18081}}
      PORT: 8080
    # api 不外暴：所有 API/WS 流量经 web 容器内反代走 api:8080
    expose:
      - '8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:8080/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  jobs:
    build:
      context: .
      dockerfile: infra/jobs.Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jev}:${POSTGRES_PASSWORD:?请在 .env 填写 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jev}
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 填写 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-jev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 备份须离机存放；容器卷只做第一层兜底（docs/rebuild/02-MVP.md §4）
    # 不映射到宿主端口（宿主 5432 已被其他 Postgres 占用），仅容器内网互通
    expose:
      - '5432'
    healthcheck:
      # 用 bash /dev/tcp 做纯 TCP 端口探活：只完成 SYN→SYN-ACK→RST，绝不发 libpq 握手包，
      # 因此不会产生任何 postgres 日志条目（user/db/role 错配也不会污染日志）。
      # docker daemon 会在失败时打一行 "health: unhealthy"，但不会触发 postgres 日志。
      test: ['CMD-SHELL', 'bash -c "exec 3<>/dev/tcp/127.0.0.1/5432 && exec 3<&- && exec 3>&-"']
      interval: 5s
      timeout: 3s
      retries: 20

  # 可选：一次性导入题库并本地发布（仅测试环境；正式环境须走权利审核，见 README）
  # 用法：docker compose --profile seed run --rm seed
  seed:
    profiles: ['seed']
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jev}:${POSTGRES_PASSWORD:?请在 .env 填写 POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jev}
    depends_on:
      postgres:
        condition: service_healthy
    command: ['sh', '-c', 'pnpm --dir packages/database run db:migrate && pnpm --dir packages/database run db:import-library -- --publish']

volumes:
  postgres-data:
