name: 🧩 新题投稿
description: 投稿一道海龟汤。不用懂代码，填表即可。
title: "[Puzzle] "
labels: ["puzzle-submission", "pending-review"]
body:
  - type: input
    id: title
    attributes:
      label: 题目名称（≤ 30 字）
      placeholder: 例如：消失的钥匙
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: 题目来源
      options:
        - 原创
        - 经典题改写
        - 翻译 / 改编
    validations:
      required: true
  - type: input
    id: source_link
    attributes:
      label: 来源链接（若选择 经典题改写 / 翻译改编，请贴）
    validations:
      required: false
  - type: input
    id: author
    attributes:
      label: 署名（将出现在题目公开版）
      placeholder: 留空则显示「匿名玩家」
    validations:
      required: false
  - type: textarea
    id: story
    attributes:
      label: 汤面（≤ 500 字）
      description: 玩家读到的故事。离奇、有画面感、信息密度高。
    validations:
      required: true
  - type: textarea
    id: answer
    attributes:
      label: 汤底（≤ 1500 字）
      description: 完整真相。必须能闭环解释汤面的每一处异常。
    validations:
      required: true
  - type: textarea
    id: hints
    attributes:
      label: 提示一（必填，≤ 100 字）
      description: 给卡住的玩家一点方向。
    validations:
      required: true
  - type: textarea
    id: hints2
    attributes:
      label: 提示二（选填，≤ 100 字）
      description: 换个角度再给一条。
    validations:
      required: false
  - type: textarea
    id: hints3
    attributes:
      label: 提示三（选填，≤ 100 字）
      description: 最后一条提示。
    validations:
      required: false
  - type: checkboxes
    id: compliance
    attributes:
      label: 投稿守则确认
      options:
      - label: 题目未涉及真实人物、地点、事件
        required: true
      - label: 题目未涉及种族 / 性别 / 宗教 / 性向等敏感设定
        required: true
      - label: 暴力 / 自残 / 虐待止于推断，无过程描写
        required: true
      - label: 我同意以 GPL-3.0 协议发布我的贡献
        required: true