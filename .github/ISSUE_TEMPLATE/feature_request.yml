name: 💡 功能建议
description: 提一个产品功能或体验改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 一句话讲清楚你遇到的问题或机会。
      placeholder: 现在玩家看不到自己总共破解了多少题...
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你想要的方案
      description: 描述你心里的实现。可以画个草图、贴个截图。
    validations:
      required: false
  - type: textarea
    id: alt
    attributes:
      label: 备选方案
      description: 还有别的思路吗？
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: 附加信息（可选）
      description: 截图、参考链接、竞品对比都可以。
    validations:
      required: false